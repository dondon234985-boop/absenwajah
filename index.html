<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Digital - Multi Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
    .main-container { max-width: 500px; margin: auto; padding: 20px; }
    #video-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); line-height: 0; }
    video { width: 100%; height: auto; display: block; }
    .badge-status { font-size: 0.9rem; padding: 8px 15px; border-radius: 50px; }
    .btn-custom { padding: 15px; font-weight: bold; border-radius: 12px; transition: 0.3s; }
    
    /* Navigasi Bawah atau Atas */
    .nav-pills .nav-link { border-radius: 10px; font-weight: bold; padding: 10px; color: #666; }
    .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
    
    .page-section { display: none; }
    .active-page { display: block; }
  </style>
</head>
<body>

<div class="main-container">
  <!-- Navigasi Menu -->
  <ul class="nav nav-pills nav-justified mb-4 bg-white p-2 shadow-sm rounded-4" id="menu">
    <li class="nav-item">
      <a class="nav-link active" href="#" onclick="showPage('absen-page', this)">Menu Absen</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" onclick="showPage('daftar-page', this)">Menu Daftar</a>
    </li>
  </ul>

  <!-- Area Kamera (Tetap terlihat di kedua halaman) -->
  <div id="video-container" class="mb-3">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div class="text-center mb-4">
    <span id="status" class="badge-status badge bg-secondary text-white">Memuat AI...</span>
  </div>

  <!-- HALAMAN 1: FORM ABSEN -->
  <div id="absen-page" class="page-section active-page">
    <div class="text-center mb-3">
      <h5 class="fw-bold">Halaman Presensi</h5>
      <p class="text-muted small">Klik tombol sesuai kebutuhan Anda</p>
    </div>
    <div class="row g-2">
      <div class="col-6">
        <button id="btnMasuk" class="btn btn-success btn-custom w-100 shadow-sm" onclick="processAbsence('MASUK')" disabled>
          ABSEN MASUK
        </button>
      </div>
      <div class="col-6">
        <button id="btnPulang" class="btn btn-danger btn-custom w-100 shadow-sm" onclick="processAbsence('PULANG')" disabled>
          ABSEN PULANG
        </button>
      </div>
    </div>
  </div>

  <!-- HALAMAN 2: FORM DAFTAR -->
  <div id="daftar-page" class="page-section">
    <div class="card border-0 shadow-sm p-4 rounded-4">
      <h5 class="fw-bold mb-3 text-center">Registrasi Wajah</h5>
      <div class="mb-2">
        <label class="small fw-bold">Nama Karyawan</label>
        <input type="text" id="regNama" class="form-control" placeholder="Nama Lengkap">
      </div>
      <div class="mb-4">
        <label class="small fw-bold">Nomor Induk / NIK</label>
        <input type="text" id="regNIK" class="form-control" placeholder="Contoh: 2023001">
      </div>
      <button id="btnReg" class="btn btn-primary btn-custom w-100 shadow-sm" onclick="register()">
        DAFTARKAN WAJAH SEKARANG
      </button>
    </div>
  </div>

  <p class="text-center mt-5 text-muted" style="font-size: 10px;">GAS-WebMaster System v2.0</p>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzaDkGzLcs_HzcaqtaKlMuVevysQ-tnQKxzutyMSStTNKePvrxcVOSxkdpAeWNFYRDC/exec"; 
  
  let labeledDescriptors = [];
  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const btnMasuk = document.getElementById('btnMasuk');
  const btnPulang = document.getElementById('btnPulang');
  const btnReg = document.getElementById('btnReg');

  // Fungsi Pindah Halaman
  function showPage(pageId, element) {
    // Sembunyikan semua halaman
    document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active-page'));
    // Tampilkan halaman terpilih
    document.getElementById(pageId).classList.add('active-page');
    
    // Update menu aktif
    document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
    element.classList.add('active');
  }

  // Inisialisasi AI & Kamera
  async function init() {
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
    try {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL)
      ]);

      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;

      const response = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "getFaces" }) });
      const faces = await response.json();
      labeledDescriptors = faces.map(d => new faceapi.LabeledFaceDescriptors(d.name, [new Float32Array(d.descriptor)]));
      
      updateStatus("SISTEM SIAP", "success");
      btnMasuk.disabled = false;
      btnPulang.disabled = false;
    } catch (err) {
      updateStatus("GAGAL MEMUAT SISTEM", "danger");
    }
  }

  // Fungsi Absensi
  async function processAbsence(tipe) {
    btnMasuk.disabled = true;
    btnPulang.disabled = true;
    updateStatus(`SEDANG PROSES ${tipe}...`, "warning");

    try {
      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      if (!detection) {
        alert("Wajah tidak terdeteksi! Pastikan wajah terlihat jelas.");
        resetAbsenUI();
        return;
      }

      const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
      const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
      
      if (bestMatch.label === 'unknown') {
        alert("Wajah tidak dikenali dalam database!");
        resetAbsenUI();
      } else {
        navigator.geolocation.getCurrentPosition(async pos => {
          const loc = `${pos.coords.latitude},${pos.coords.longitude}`;
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "attendance", name: bestMatch.label, type: tipe, location: loc })
          });
          const result = await res.json();
          alert(`SISTEM: ${result.message}\nNama: ${bestMatch.label}`);
          resetAbsenUI();
        }, (err) => {
          alert("Gagal ambil lokasi GPS. Harap aktifkan GPS HP Anda.");
          resetAbsenUI();
        });
      }
    } catch (e) {
      alert("Terjadi kesalahan teknis.");
      resetAbsenUI();
    }
  }

  // Fungsi Registrasi
  async function register() {
    const nama = document.getElementById('regNama').value;
    const nik = document.getElementById('regNIK').value;
    if(!nama || !nik) return alert("Lengkapi data Nama dan NIK!");
    
    btnReg.disabled = true;
    updateStatus("MEREKAM WAJAH...", "warning");

    try {
      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      if(detection) {
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "register", name: nama, nik: nik, descriptor: Array.from(detection.descriptor) })
        });
        alert("Registrasi Berhasil! Halaman akan dimuat ulang.");
        location.reload();
      } else {
        alert("Gagal mendeteksi wajah.");
        btnReg.disabled = false;
        updateStatus("SISTEM SIAP", "success");
      }
    } catch (e) {
      alert("Gagal menyimpan data.");
      btnReg.disabled = false;
    }
  }

  function resetAbsenUI() {
    btnMasuk.disabled = false;
    btnPulang.disabled = false;
    updateStatus("SISTEM SIAP", "success");
  }

  function updateStatus(text, type) {
    status.innerText = text;
    status.className = `badge-status badge bg-${type} text-white`;
  }

  window.onload = init;
</script>
</body>
</html>
